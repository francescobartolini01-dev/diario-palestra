<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftLog · Diario di palestra</title>
<meta name="theme-color" content="#F6F5EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14332A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<script>try{var th=localStorage.getItem("liftlog-theme");if(th==="dark"||th==="light"){document.documentElement.dataset.theme=th;document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=th==="dark"?"#14332A":"#F6F5EE"})}}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5EE; --surface:#FFFFFF; --surface2:#EFEEE4; --ink:#14332A; --muted:#5A6660; --line:#DCDACB;
  --push:#C8243A; --pull:#1E5AA8; --legs:#C99300; --core:#2E7D52;
  --focus:#14332A; --warn:#A8561B; --ok:#2E7D52;
  --accent:#F5E04A; --on-accent:#14332A; --accent-line:#D9A520;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14332A; --surface:#1A3E33; --surface2:#21473A; --ink:#F4F3EA; --muted:#AEBDB4; --line:#2E5646;
    --push:#E5576A; --pull:#5B93E0; --legs:#E8B52A; --core:#4CB17D; --focus:#F5E04A; --warn:#E39A5C; --ok:#4CB17D;
    --accent:#F5E04A; --on-accent:#14332A; --accent-line:#F5E04A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14332A; --surface:#1A3E33; --surface2:#21473A; --ink:#F4F3EA; --muted:#AEBDB4; --line:#2E5646;
  --push:#E5576A; --pull:#5B93E0; --legs:#E8B52A; --core:#4CB17D; --focus:#F5E04A; --warn:#E39A5C; --ok:#4CB17D;
  --accent:#F5E04A; --on-accent:#14332A; --accent-line:#F5E04A;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
h1,h2,h3{margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topin{max-width:860px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px}
.brand h1 img{width:36px;height:36px;flex:none}
.brand small{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-line)}

/* Week strip — the plates */
.week{margin:24px 0 8px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.week h2{font-size:clamp(34px,7vw,52px);font-weight:700}
.week p{margin:4px 0 0;color:var(--muted)}
.plates{display:flex;gap:6px;margin-top:16px}
.plate{flex:1;max-width:84px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;position:relative;font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--muted);font-size:15px}
/* giorno allenato: fulmine giallo del logo sopra, lettera del giorno sotto */
.plate.on{border:2px solid #F5E04A;background:#14332A;color:#F4F3EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 3px rgba(245,224,74,.22)}
.plate.on .bolt{width:30%;max-width:24px;height:auto;flex:none;display:block;margin-bottom:1px}
.plate.on span{line-height:1}
.plate.today{outline:2px solid var(--ink);outline-offset:3px}
.plate .seg{position:absolute;inset:0;border-radius:50%}
.recov{margin:14px 0 0;font-size:14px;color:var(--muted)}
.recov b{color:var(--ink);font-weight:600}

/* Cards & forms */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
section.card h3{font-size:24px;font-weight:700;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--push)}
.btn:disabled{opacity:.5;cursor:default}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.exhead .name{font-weight:600}
.lastnote{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent-line);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:15px;white-space:pre-wrap}
.lastnote b{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.exnote{margin-top:8px}
.hist .exn{font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:500}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:6px;align-items:center}
.sets .n{color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:17px;text-align:center}
.sets .hd{font-size:12px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;min-height:36px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:13px}
.hist{list-style:none;padding:0;margin:0}
.hist li{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.hist li>div:first-child{flex:1 1 220px}
.hacts{flex-wrap:nowrap !important;gap:6px !important}
.hist li:first-child{border-top:0}
.hist .d{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600}
.empty{padding:20px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.notice{background:var(--surface2);border-left:4px solid var(--legs);padding:12px 14px;border-radius:8px;margin-top:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Charts */
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:420px}
.chart.fit svg{min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}

/* Report */
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0}
.period h2{font-size:clamp(28px,6vw,40px);font-weight:700;text-align:center;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.stats div{background:var(--surface);padding:14px}
.stats b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.mbar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;padding:6px 0}
.mbar .track{height:14px;background:var(--surface2);border-radius:99px;position:relative;overflow:hidden}
.mbar .fill{height:100%;border-radius:99px}
.mbar .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted);opacity:.6}
.mbar .v{text-align:right;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600}
.advice{list-style:none;padding:0;margin:0}
.advice li{padding:12px 0 12px 16px;border-top:1px solid var(--line);position:relative}
.advice li:first-child{border-top:0}
.advice li::before{content:"";position:absolute;left:0;top:18px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.advice li.w::before{background:var(--warn)}
.advice li.g::before{background:var(--ok)}
.ai{margin-top:14px;white-space:pre-wrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:500;border-top:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tpl{border-top:1px solid var(--line);padding:16px 0}
.tpl:first-of-type{border-top:0}
.tpl h4{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.tplex{margin:10px 0 12px;padding-left:22px;display:grid;gap:4px}
.tplex li span{margin-left:8px;font-size:13px}
.tplrow{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tplrow:first-child{border-top:0}
.tplrow .ord{display:flex}
.tplrow .x:disabled{opacity:.25;cursor:default}
#sumDlg{max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px}
#sumDlg h3{font-size:30px;font-weight:700}
.sumsec{margin-top:20px}
.sumsec h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.regbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:4px 0 8px;background:var(--surface2)}
.prs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prs li{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent-line);border-radius:8px;padding:10px 12px}
.delta{font-weight:600;white-space:nowrap}
.delta.up{color:var(--ok)}
.delta.down{color:var(--warn)}
.sumbtns{position:sticky;bottom:-20px;background:var(--surface);padding:14px 0 4px;margin-top:16px;justify-content:flex-end}
.goal{font-size:14px;margin-top:4px}
.goal b{font-weight:600}
.tplnote{margin:8px 0 0;white-space:pre-wrap}
.brandr{display:flex;align-items:center;gap:10px;min-width:0}
.brandr small{text-align:right}
.themebtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.themebtn svg{width:20px;height:20px}
.exctl{display:flex;align-items:center;gap:2px;flex:none}
.exhead>div:first-child{min-width:0}
.grip{border:0;background:none;color:var(--muted);cursor:grab;touch-action:none;width:30px;min-height:40px;display:grid;place-items:center;flex:none;padding:0}
.grip svg{width:16px;height:16px}
.grip:active{cursor:grabbing}
.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:12px;transition:none!important}
.sliding{transition:transform .15s ease}
.unibtn{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.unibtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.sets.uni{grid-template-columns:24px 1fr 1fr 1fr 1fr 30px;gap:5px}
.sets.uni .hd{text-align:center}
.sets.uni .hd.dx,.sets.uni .hd.sx{grid-column:span 2;font-weight:600;color:var(--ink);border-bottom:2px solid var(--line);padding-bottom:2px}
.sets.uni input{padding:9px 6px}
.unichk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.undobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent-line);border-radius:8px;padding:8px 8px 8px 12px;margin:0 0 12px;font-size:14px}
/* calendario allenamenti */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.calnav h4{margin:0;flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700}
.calsum{margin:0 0 6px;color:var(--muted)}
.calsum b{color:var(--ink);font-weight:600}
.calrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.calday b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1.05}
.calday span{font-size:13px;color:var(--muted)}
.calrow.today .calday b{text-decoration:underline;text-decoration-color:var(--accent-line);text-decoration-thickness:3px;text-underline-offset:3px}
.calrest{margin:0;color:var(--muted);font-size:15px}
.calw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:inherit;font:inherit;min-height:52px}
.calw+.calw{margin-top:6px}
.calwt{flex:1;display:flex;flex-direction:column;min-width:0}
.calwt b{font-weight:600}
.calgo{font-size:24px;color:var(--muted)}
.mini{width:36px;height:36px;border-radius:50%;background:#14332A;border:2px solid #F5E04A;display:grid;place-items:center;flex:none}
.mini .bolt{width:38%;height:auto;display:block}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:520px;margin:6px auto 0}
.calgrid .hd{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:var(--ink);border:2px solid transparent;background:none;padding:0}
.cell.on{background:#14332A;border-color:#F5E04A;color:#F4F3EA;cursor:pointer;line-height:1;gap:3px;font-size:15px}
.cell.on .bolt{width:26%;max-width:14px;height:auto;display:block}
.cell.today{outline:2px solid var(--ink);outline-offset:2px}
.cell.future{color:var(--muted);opacity:.55}
/* recupero attivo */
.reccard details>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
.reccard details>summary::-webkit-details-marker{display:none}
.reccard summary::after{content:"›";margin-left:auto;font-size:26px;color:var(--muted);transition:transform .2s}
.reccard details[open] summary::after{transform:rotate(90deg)}
.rectitle{display:flex;flex-direction:column}
.rectitle b{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1.1}
.reclist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.reclist li{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reclist label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.reclist input{width:22px;height:22px;margin-top:2px;accent-color:#14332A;flex:none}
.reclist .recdose{display:inline-block;font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.reclist .recwhy{display:block;margin-top:3px}
.reclist li.done{opacity:.6}
.reclist li.done b{text-decoration:line-through}
.reclist.compact li{padding:8px 10px}
/* pallini cliccabili, cardio, core */
button.plate{font:inherit;padding:0;cursor:pointer}
button.plate.on:active,button.cell.on:active{transform:scale(.92)}
.mini .zen{width:74%;height:auto;display:block}
.zenmini{width:44px;height:44px}
.cardiorow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.warmchk{margin-top:10px;font-size:14px;color:var(--ink)}
.tag.coretag{background:var(--accent);color:var(--on-accent);border-color:var(--accent-line)}
.cgoal{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.cgoal b{font-family:"Barlow Condensed",sans-serif;font-size:44px;line-height:1}
.cgoal span{color:var(--muted)}
.ctrack{height:14px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.cfill{height:100%;background:var(--accent);border-right:2px solid var(--accent-line)}
.histhint{text-align:center;margin:14px 0 0}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent-line);text-decoration-thickness:2px;cursor:pointer}
#sumDlg .sumbtns{flex-wrap:wrap}
@media (max-width:560px){.cardiorow{grid-template-columns:1fr 1fr}.cardiorow label:last-child{grid-column:span 2}}
/* account */
.authform{display:grid;gap:10px;max-width:420px}
.authmsg{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface2);border-left:4px solid var(--accent-line)}
.chips label{border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}

/* ================= Splash di apertura ================= */
#splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#21473A 0%,#14332A 45%,#0B1F19 100%);color:#F4F3EA;cursor:pointer;-webkit-tap-highlight-color:transparent}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;animation:spShake .42s linear 1.02s both}
#splash .sp-logo{width:min(62vw,300px);height:auto;overflow:visible;display:block}
#splash .sp-ring-track{opacity:0;animation:spFade .3s ease-out .05s forwards}
#splash .sp-ring{stroke-dasharray:0 490.1;filter:drop-shadow(0 0 6px rgba(245,224,74,.9));animation:spRing .9s cubic-bezier(.65,0,.25,1) .1s forwards}
#splash .sp-lifter{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:spLift .55s cubic-bezier(.2,1.7,.4,1) .55s forwards}
#splash .sp-bolt{transform-box:fill-box;transform-origin:50% 40%;opacity:0;animation:spBolt .38s cubic-bezier(.2,1.5,.35,1) .95s forwards}
#splash .sp-flash{transform-box:fill-box;transform-origin:center;opacity:0;animation:spFlash .5s ease-out 1s forwards}
#splash .sp-wave{transform-box:fill-box;transform-origin:center;opacity:0;animation:spWave .75s cubic-bezier(.1,.7,.3,1) 1s forwards}
#splash .sp-wave.w2{animation-delay:1.14s}

/* ---------- Esercizi a un lato alla volta (dx / sx) ---------- */
// Negli esercizi "uni" ogni serie ha destra (kg, reps) e sinistra (kgS, repsS).
const sideSets=e=>e.uni?e.sets.flatMap(s=>[{kg:s.kg,reps:s.reps,side:"dx"},{kg:s.kgS,reps:s.repsS,side:"sx"}]):e.sets;
const doneSets=e=>e.sets.filter(s=>num(s.reps)>0||(e.uni&&num(s.repsS)>0)).length;
// una serie in testo; negli esercizi a tempo "reps" sono secondi
const one=(kg,r,time)=>time?`${num(kg)?r1(num(kg))+" kg · ":""}${num(r)} s`:`${r1(num(kg))}×${num(r)}`;
const setStr=(s,uni,time)=>uni?`dx ${one(s.kg,s.reps,time)} / sx ${one(s.kgS,s.repsS,time)}`:one(s.kg,s.reps,time);
const copySet=(s,uni)=>uni?{kg:s.kg??"",reps:s.reps??"",kgS:s.kgS??s.kg??"",repsS:s.repsS??s.reps??""}:{kg:s.kg??"",reps:s.reps??""};
const isUni=name=>!!exInfo(name).u;
// Core: esercizi che lavorano solo l'addome. Contano a parte, senza kg sollevati né massimale.
const isCore=name=>{const i=exInfo(name);return i.t!=="cardio"&&i.p.length>0&&i.p.every(m=>m==="Addome")};
// A tempo: plank e simili, le "ripetizioni" sono secondi
const isTime=name=>!!exInfo(name).time||/plank/i.test(name);
// Cardio: intensità e minuti "equivalenti moderati" (l'intenso vale doppio, il leggero metà)
const INT={leggera:{f:.5,l:"Leggera"},moderata:{f:1,l:"Moderata"},intensa:{f:2,l:"Intensa"}};
const intOf=e=>INT[e.int]?e.int:"moderata";
const cardioEqMin=e=>e.warm?0:num(e.minutes)*INT[intOf(e)].f;
const CARDIO_TARGET=150; // minuti moderati a settimana

/* ---------- Date ---------- */
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GG=["L","M","M","G","V","S","D"];
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const monday=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return fmt(d)};
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const nice=s=>{const d=parse(s);return `${d.getDate()} ${MESI[d.getMonth()]}`};
const niceShort=s=>{const d=parse(s);return `${d.getDate()}/${d.getMonth()+1}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const r1=n=>Math.round(n*10)/10;

/* ---------- Stato e salvataggio ---------- */
const S={ready:false,mode:"local",workouts:[],weights:[],custom:{},templates:[],recDone:{},meta:{u:{},del:{}}};
const LS_KEY="diario-palestra-v1";

function loadLocal(){
  try{const o=JSON.parse(localStorage.getItem(LS_KEY)||"{}");S.workouts=o.workouts||[];S.weights=o.weights||[];S.custom=o.custom||{};S.templates=o.templates||[];S.recDone=o.recDone||{};
    S.meta=o.meta&&o.meta.u&&o.meta.del?o.meta:{u:{},del:{}}}catch(e){}
  SNAP=snapMap();
}
// raw: salva senza segnare modifiche (usato dopo aver unito i dati dal cloud)
function saveLocal(raw){
  if(!raw)stamp();
  try{localStorage.setItem(LS_KEY,JSON.stringify(docData()))}catch(e){}
  if(!raw)scheduleSync();
}
const docData=()=>({v:1,workouts:S.workouts,weights:S.weights,custom:S.custom,templates:S.templates,recDone:S.recDone,meta:S.meta});

/* ---------- Sincronizzazione tra dispositivi (Supabase) ----------
   Ogni elemento ha una chiave (w:allenamento, p:peso, t:scheda, c:esercizio, r:recuperi del giorno)
   e l'ora della sua ultima modifica in meta.u; le eliminazioni restano in meta.del.
   Unendo due dispositivi vince la modifica più recente, elemento per elemento. */
let SNAP=new Map();let app_onFocusOut=()=>{};
function snapMap(){const m=new Map();
  for(const w of S.workouts)m.set("w:"+w.id,JSON.stringify(w));
  for(const x of S.weights)m.set("p:"+x.id,JSON.stringify(x));
  for(const t of S.templates)m.set("t:"+t.id,JSON.stringify(t));
  for(const [k,v] of Object.entries(S.custom))m.set("c:"+k,JSON.stringify(v));
  for(const [k,v] of Object.entries(S.recDone))m.set("r:"+k,JSON.stringify(v));
  return m}
function stamp(){const now=Date.now(),cur=snapMap();
  for(const [k,v] of cur)if(SNAP.get(k)!==v){S.meta.u[k]=now;delete S.meta.del[k]}
  for(const k of SNAP.keys())if(!cur.has(k)){S.meta.del[k]=now;delete S.meta.u[k]}
  SNAP=cur}
function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  const before=JSON.stringify(docData());
  const ru=(r.meta&&r.meta.u)||{},rd=(r.meta&&r.meta.del)||{},lu=S.meta.u,ld=S.meta.del;
  const del={...ld};for(const [k,t] of Object.entries(rd))if(!(del[k]>=t))del[k]=t;
  const u={};
  const pick=(k,lv,rv)=>{const a=lv===undefined?-1:(lu[k]||0),b=rv===undefined?-1:(ru[k]||0);
    const [v,t]=b>a?[rv,b]:[lv,a];if(v===undefined)return undefined;if(del[k]!==undefined&&del[k]>=t)return undefined;u[k]=t;return v};
  const arr=(name,pre)=>{const L=new Map(S[name].map(x=>[pre+x.id,x])),R=new Map((Array.isArray(r[name])?r[name]:[]).filter(x=>x&&x.id).map(x=>[pre+x.id,x]));
    const out=[];for(const k of new Set([...L.keys(),...R.keys()])){const v=pick(k,L.get(k),R.get(k));if(v!==undefined)out.push(v)}return out};
  const obj=(name,pre)=>{const L=S[name]||{},R=(r[name]&&typeof r[name]==="object")?r[name]:{},out={};
    for(const k of new Set([...Object.keys(L),...Object.keys(R)])){const v=pick(pre+k,L[k],R[k]);if(v!==undefined)out[k]=v}return out};
  S.workouts=arr("workouts","w:");S.weights=arr("weights","p:");S.templates=arr("templates","t:");
  S.custom=obj("custom","c:");S.recDone=obj("recDone","r:");
  const old=Date.now()-120*864e5;for(const k of Object.keys(del))if(del[k]<old)delete del[k];
  S.meta={u,del};SNAP=snapMap();saveLocal(true);
  return JSON.stringify(docData())!==before;
}
const SB=(()=>{const c=window.LIFTLOG_SUPABASE||{};const url=String(c.url||"").trim().replace(/\/+$/,"").replace(/\/(rest|auth)\/v1$/,""),key=String(c.key||"").trim();
  return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&key?{url,key}:null})();
const AUTH_KEY="liftlog-auth";
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem(AUTH_KEY)||"null")}catch(e){}
const SYNC={state:"idle",last:0,busy:false,again:false,timer:0};
function setAuth(a){AUTH=a;try{a?localStorage.setItem(AUTH_KEY,JSON.stringify(a)):localStorage.removeItem(AUTH_KEY)}catch(e){}}
function sessionFrom(j){if(!j||!j.access_token)return null;
  return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}}}
async function sbReq(path,{method="GET",body,auth=true,prefer}={}){
  const h={"apikey":SB.key,"Content-Type":"application/json"};
  if(auth){await freshToken();h.Authorization="Bearer "+AUTH.access_token}
  if(prefer)h.Prefer=prefer;

const exInfo=name=>LIB[name]||S.custom[name]||{t:"free",p:[],s:[]};

const sortedP=()=>[...S.weights].sort((a,b)=>a.date<b.date?-1:1);
const e1rm=(kg,reps)=>reps>0&&kg>0?kg*(1+Math.min(reps,12)/30):0;

function periodStats(from,to){
  const ws=sortedW().filter(w=>w.date>=from&&w.date<=to);
  const sets={},ton={},days=new Set(),byDayMuscle={};
  let totSets=0,tonnage=0,cardioMin=0,cardioEq=0,warmMin=0,coreSets=0;const byInt={leggera:0,moderata:0,intensa:0};
  for(const m in MUSCLES)sets[m]=0;
  for(const w of ws){
    days.add(w.date);
    for(const e of w.exercises){
      const info=exInfo(e.name);
      if(info.t==="cardio"){const m=num(e.minutes);if(e.warm){warmMin+=m;continue}
        cardioMin+=m;cardioEq+=cardioEqMin(e);byInt[intOf(e)]+=m;(byDayMuscle[w.date]??=new Set()).add("Cardio");continue}
      const n=doneSets(e); if(!n)continue;
      if(isCore(e.name)){coreSets+=n;sets.Addome=(sets.Addome||0)+n;(byDayMuscle[w.date]??=new Set()).add("Addome");continue}
      totSets+=n;
      for(const s of sideSets(e))tonnage+=num(s.kg)*num(s.reps);
      for(const m of info.p){sets[m]=(sets[m]||0)+n;(byDayMuscle[w.date]??=new Set()).add(m)}
      for(const m of info.s)sets[m]=(sets[m]||0)+n*0.5;
    }
  }
  return {ws,sets,totSets,tonnage,cardioMin,cardioEq,warmMin,byInt,coreSets,days:[...days].sort(),byDayMuscle};
}
function bestByExercise(upTo,from){
  // miglior 1RM stimato per esercizio prima di "from" e nel periodo
  const before={},during={};
  for(const w of S.workouts){
    if(w.date>upTo)continue;
    for(const e of w.exercises){
      if(exInfo(e.name).t==="cardio"||isCore(e.name))continue;
      for(const s of sideSets(e)){const v=e1rm(num(s.kg),num(s.reps));if(!v)continue;
        const tgt=w.date<from?before:during;
        if(!tgt[e.name]||v>tgt[e.name].v)tgt[e.name]={v,kg:num(s.kg),reps:num(s.reps),date:w.date};
      }
    }
  }
  return {before,during};
}
function weightNear(dateStr,dir){

  if(dir<0){let r=null;for(const x of p)if(x.date<=dateStr)r=x;return r}
  return p.find(x=>x.date>=dateStr)||null;
}

/* ---------- Consigli di recupero (regole) ---------- */
function buildAdvice(st,from,to,mode){
  const out=[];
  const weeks=Math.max(1,(dayDiff(from,to)+1)/7);
  const perWeek=st.days.length/weeks;
  const wk=m=>st.sets[m]/weeks;
  if(st.days.length===0){out.push(["","Non hai registrato allenamenti in questo periodo. Se è stata una pausa voluta, al rientro riparti con carichi un po’ più bassi (circa il 10–20% in meno) per la prima seduta."]);return out}
  if(perWeek>=6)out.push(["w",`Ti sei allenato in media ${r1(perWeek)} giorni a settimana. Inserisci almeno un giorno di riposo completo: è nei giorni di pausa che muscoli, tendini e sistema nervoso si adattano davvero.`]);
  else if(perWeek<2)out.push(["",`Frequenza bassa (${r1(perWeek)} sedute a settimana). Con poche sedute rendono di più gli allenamenti total body, così ogni muscolo viene stimolato almeno due volte.`]);
  else out.push(["g",`Buona frequenza: ${r1(perWeek)} sedute a settimana lasciano spazio sia allo stimolo sia al recupero.`]);

  const high=Object.keys(MUSCLES).filter(m=>m!=="Cardio"&&m!=="Addome"&&wk(m)>20);
  const cw=st.coreSets/weeks;
  if(cw>14)out.push(["",`Core: circa ${Math.round(cw)} serie a settimana. Oltre le 10 serie il guadagno è minimo: meglio puntare su varianti più difficili o su più secondi di tenuta.`]);
  else if(cw<3&&perWeek>=2)out.push(["",`Poco lavoro sul core (${r1(cw)} serie a settimana): bastano 6–10 serie, divise in 2–3 sedute, per un tronco più stabile in panca e squat.`]);
  const eq=st.cardioEq/weeks;
  if(st.cardioMin||st.warmMin){
    if(eq>=CARDIO_TARGET)out.push(["g",`Cardio: circa ${Math.round(eq)} minuti moderati a settimana, obiettivo dei ${CARDIO_TARGET} raggiunto.`]);
    else out.push(["",`Cardio: circa ${Math.round(eq)} minuti moderati a settimana su ${CARDIO_TARGET} consigliati. Il riscaldamento non conta: aggiungi qualche sessione a parte o allunga quelle che fai.`]);
  }
  for(const m of high)out.push(["w",`${m}: circa ${Math.round(wk(m))} serie a settimana, sopra la fascia 10–20 che di solito si recupera bene. Se senti affaticamento o i carichi calano, riduci le serie o distribuiscile su più giorni.`]);

  const consec=new Map();
  for(const d of st.days){const nx=addDays(d,1);if(!st.byDayMuscle[nx])continue;
    for(const m of st.byDayMuscle[d])if(m!=="Cardio"&&m!=="Addome"&&st.byDayMuscle[nx].has(m))consec.set(m,`${niceShort(d)} e ${niceShort(nx)}`)}
  for(const [m,when] of consec){
    const h=BIG.has(m)?"72":"48";
    out.push(["w",`Hai allenato ${m.toLowerCase()} in giorni consecutivi (${when}). Per un gruppo ${BIG.has(m)?"grande":"piccolo"} come questo lascia di solito ${h} ore prima di rilavorarlo a fondo.`]);
  }
  const push=wk("Petto")+wk("Spalle"),pull=wk("Dorsali")+wk("Schiena alta");
  if(push>=6&&push>pull*1.5)out.push(["w",`Più spinta (${Math.round(push)} serie/sett. tra petto e spalle) che tirata (${Math.round(pull)}). Aggiungi rematori, trazioni o face pull: aiutano la postura e proteggono le spalle.`]);
  else if(pull>=6&&pull>push*1.5)out.push(["",`Molta più tirata che spinta: valuta qualche serie in più di panca o military press per bilanciare.`]);
  const legs=wk("Quadricipiti")+wk("Femorali")+wk("Glutei"),upper=push+pull;
  if(upper>=10&&legs<4)out.push(["w","Gambe poco allenate rispetto alla parte alta. Anche una seduta a settimana con squat o leg press e un esercizio per i femorali fa una bella differenza."]);
  if(wk("Quadricipiti")>=6&&wk("Femorali")<wk("Quadricipiti")/3)out.push(["","I femorali ricevono poco lavoro rispetto ai quadricipiti: un leg curl o uno stacco rumeno riducono lo squilibrio, che è tra le cause più comuni di fastidi al ginocchio."]);

  const pa=weightNear(from,-1)||weightNear(from,1),pb=weightNear(to,-1);
  if(pa&&pb&&pa.id!==pb.id){
    const ch=(pb.kg-pa.kg)/pa.kg*100/Math.max(1,dayDiff(pa.date,pb.date)/7);
    if(ch<-1)out.push(["w",`Il peso corporeo scende di circa ${Math.abs(r1(ch))}% a settimana: un calo rapido può rallentare il recupero. Cura sonno e apporto proteico, e non aumentare il volume in questa fase.`]);
    else if(ch>0.7)out.push(["",`Il peso sale di circa ${r1(ch)}% a settimana: se stai cercando di aumentare la massa va bene, ma un ritmo più lento di solito limita l’accumulo di grasso.`]);
  }
  const lw=latestWeight();
  out.push(["g",lw?`Proteine: per chi si allena con i pesi si consigliano in genere 1,6–2,2 g per kg di peso. Con ${r1(lw.kg)} kg sono circa ${Math.round(lw.kg*1.6)}–${Math.round(lw.kg*2.2)} g al giorno, divisi in 3–4 pasti.`:"Proteine: per chi si allena con i pesi si consigliano in genere 1,6–2,2 g per kg di peso corporeo, divisi in 3–4 pasti. Registra il peso per avere il calcolo."]);
  out.push(["g","Dormi 7–9 ore: il sonno è il fattore di recupero con l’effetto più grande. Nei giorni di riposo una camminata di 20–30 minuti o un po’ di mobilità aiutano a ridurre l’indolenzimento."]);
  if(mode==="month"&&st.totSets/weeks>60)out.push(["","Volume alto per tutto il mese: ogni 4–8 settimane una settimana di scarico (metà delle serie, stessi esercizi) aiuta a consolidare i progressi."]);
  return out;
}

/* ---------- Grafici SVG ---------- */
function lineChart(series,opts={}){
  const W=640,H=240,L=44,R=14,T=14,B=30;
  const pts=series.flatMap(s=>s.data);
  if(!pts.length)return "";
  const xs=[...new Set(pts.map(p=>p.x))].sort();
  let ys=pts.map(p=>p.y),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(ymin===ymax){ymin-=1;ymax+=1}
  const padY=(ymax-ymin)*.12;ymin-=padY;ymax+=padY;
  const X=x=>xs.length===1?(L+W-R)/2:L+(W-L-R)*xs.indexOf(x)/(xs.length-1);
  const Y=y=>T+(H-T-B)*(1-(y-ymin)/(ymax-ymin));
  let g="";
  for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${r1(v)}</text>`}
  const step=Math.ceil(xs.length/8);
  xs.forEach((x,i)=>{if(i%step===0||i===xs.length-1)g+=`<text x="${X(x)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${niceShort(x)}</text>`});
  for(const s of series){
    const d=s.data.map((p,i)=>`${i?"L":"M"}${X(p.x)},${Y(p.y)}`).join("");
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="5 5"':""}/>`;
    g+=s.data.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}"><title>${nice(p.x)}: ${r1(p.y)} ${opts.unit||""}</title></circle>`).join("");
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Grafico")}">${g}</svg></div>`;
}
function barChart(items,o={}){
  const lab=o.label||(it=>niceShort(it.x)),tip=o.tip||(it=>`Settimana del ${nice(it.x)}: ${it.v}`),every=o.every||2,fs=o.fit?20:12;
  const W=640,H=o.fit?240:200,L=o.fit?44:30,R=10,T=14,B=o.fit?38:30,max=Math.max(4,o.target?o.target*1.15:0,...items.map(i=>i.v));
  const bw=(W-L-R)/items.length;let g="";
  for(let v=0;v<=max;v+=Math.ceil(max/4)){const y=T+(H-T-B)*(1-v/max);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="${fs}" fill="var(--muted)">${v}</text>`}
  items.forEach((it,i)=>{const h=(H-T-B)*it.v/max,x=L+i*bw+bw*.18;
    g+=`<rect x="${x}" y="${H-B-h}" width="${bw*.64}" height="${h}" rx="3" fill="${it.cur?"var(--pull)":"var(--ink)"}"><title>${esc(tip(it))}</title></rect>`;
    if(i%every===0||i===items.length-1)g+=`<text x="${x+bw*.32}" y="${H-8}" text-anchor="middle" font-size="${fs}" fill="var(--muted)">${esc(lab(it))}</text>`});
  if(o.target){const y=T+(H-T-B)*(1-o.target/max);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--accent-line)" stroke-width="3" stroke-dasharray="8 6"/>`}
  return `<div class="chart${o.fit?" fit":""}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Allenamenti per settimana")}">${g}</svg></div>`;
}

function cardioWeeks(){

  const prompt=`Sei un preparatore atletico. Rispondi in italiano, in modo pratico e conciso.

  AI.busy=true;AI.text="";const out=document.getElementById("aiOut"),btn=document.getElementById("aiBtn");
  if(btn)btn.disabled=true;if(out)out.textContent="Sto leggendo il tuo diario…";

}

function loadTemplate(t){
  const d=newDraft();d.tpl=t.name;if(t.note)d.tplNote=t.note;
  d.exercises=t.items.map(it=>{const info=exInfo(it.name);
    const plan=it.reps||it.rest||it.note?{sets:info.t==="cardio"?0:clampSets(it.sets),reps:it.reps||"",rest:it.rest||"",note:it.note||""}:null;
    const ex=info.t==="cardio"?{name:it.name,minutes:parseInt(it.reps)||"",sets:[],int:INT[it.int]?it.int:"moderata",...(it.warm?{warm:true}:{})}:(()=>{const last=lastSetsFor(it.name,d.date),src=last?last.e.sets:[],uni=it.uni??isUni(it.name);
      return {name:it.name,...(uni?{uni:true}:{}),sets:Array.from({length:clampSets(it.sets)},(_,i)=>copySet(src[Math.min(i,src.length-1)]||{},uni))}})();
    if(plan)ex.plan=plan;return ex});
  return d;
}

/* ---------- Importa / esporta schede ---------- */
const hasMuscle=m=>Object.prototype.hasOwnProperty.call(MUSCLES,m);
const txt=(v,n)=>String(v??"").trim().slice(0,n);
function cleanItem(i){
  const name=txt(i&&(i.name||i.esercizio),60);if(!name)return null;
  const c=exInfo(name).t==="cardio",it={name,sets:c?0:clampSets(i.sets??i.serie)};if(!c&&typeof i.uni==="boolean")it.uni=i.uni;
  if(c&&i.warm===true)it.warm=true;if(c&&INT[i.int])it.int=i.int;
  const reps=txt(i.reps??i.ripetizioni,30),rest=txt(i.rest??i.recupero,20),note=txt(i.note,200);
  if(reps)it.reps=reps;if(rest)it.rest=rest;if(note)it.note=note;return it;
}
async function importTemplates(files){
  let added=0,replaced=0,newEx=0,bad=0;const unknown=new Set();
  for(const f of files){
    let o;try{o=JSON.parse(await f.text())}catch(e){bad++;continue}
    const list=Array.isArray(o)?o:Array.isArray(o&&o.schede)?o.schede:Array.isArray(o&&o.templates)?o.templates:(o&&Array.isArray(o.items)?[o]:null);
    if(!list){bad++;continue}
    // prima gli esercizi nuovi, così le schede li riconoscono
    for(const [n,d] of Object.entries((o&&(o.esercizi||o.custom))||{})){
      const name=txt(n,60);if(!name||!d||typeof d!=="object")continue;
      if(S.custom[name]){if(d.u===true)S.custom[name].u=true;if(d.time===true)S.custom[name].time=true;continue}
      if(LIB[name]||S.custom[name])continue;
      const t=TYPES[d.t]?d.t:"free",p=(Array.isArray(d.p)?d.p:[]).filter(hasMuscle),s=(Array.isArray(d.s)?d.s:[]).filter(m=>hasMuscle(m)&&!p.includes(m));
      if(!p.length&&t!=="cardio")continue;
      S.custom[name]={t,p:p.length?p:["Cardio"],s,...(d.u===true&&t!=="cardio"?{u:true}:{}),...(d.time===true&&t!=="cardio"?{time:true}:{})};newEx++;
    }
    for(const raw of list){
      const name=txt(raw&&(raw.name||raw.nome),40);
      const items=(Array.isArray(raw&&raw.items)?raw.items:Array.isArray(raw&&raw.esercizi)?raw.esercizi:[]).map(cleanItem).filter(Boolean);
      if(!name||!items.length){bad++;continue}
      items.forEach(i=>{if(!LIB[i.name]&&!S.custom[i.name])unknown.add(i.name)});
      const t={id:uid(),name,items},note=txt(raw.note,600);if(note)t.note=note;
      const k=S.templates.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
      if(k>=0){if(!confirm(`La scheda "${name}" esiste già. Sostituirla con quella del file?`))continue;t.id=S.templates[k].id;S.templates[k]=t;replaced++}
      else{S.templates.push(t);added++}
    }
  }
  saveLocal();editTpl=null;TAB="plans";render();
  const msg=[added&&`${added} ${added===1?"scheda importata":"schede importate"}`,replaced&&`${replaced} sostituite`,newEx&&`${newEx} esercizi nuovi`,bad&&`${bad} file non validi`].filter(Boolean).join(" · ");
  toast(msg||"Nessuna scheda importata");
  if(unknown.size)alert(`Questi esercizi non sono nella lista dell'app: ${[...unknown].join(", ")}.\nPuoi usarli lo stesso, ma per contarli nei report crea l'esercizio con lo stesso nome (Allenamento › Crea esercizio).`);
}
function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),l=document.createElement("a");l.href=url;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportTemplate(t){
  const esercizi={};t.items.forEach(i=>{if(S.custom[i.name])esercizi[i.name]=S.custom[i.name]});
  const slug=t.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"scheda";
  downloadJSON({app:"liftlog-scheda",version:1,schede:[{name:t.name,...(t.note?{note:t.note}:{}),items:t.items}],esercizi},`liftlog-scheda-${slug}.json`);
  toast("Scheda esportata");
}

/* ---------- Riepilogo di fine allenamento ---------- */
const GIORNI=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const niceFull=s=>{const d=parse(s);return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`};
const exVol=e=>sideSets(e).reduce((a,s)=>a+num(s.kg)*num(s.reps),0);
const exReps=e=>sideSets(e).reduce((a,s)=>a+num(s.reps),0);
function bestSet(e){let b=null;for(const s of sideSets(e)){const v=e1rm(num(s.kg),num(s.reps));if(v&&(!b||v>b.v))b={v,kg:num(s.kg),reps:num(s.reps)}}return b}
function prevEx(name,date,id){
  const ws=sortedW().filter(w=>w.date<date&&w.id!==id);
  for(let i=ws.length-1;i>=0;i--){const e=ws[i].exercises.find(x=>x.name===name);if(e)return {date:ws[i].date,e}}
  return null;
}
function workoutSummary(w){
  const sets={},rows=[],prs=[];let nSets=0,reps=0,vol=0,minutes=0,coreSets=0,warm=0;
  for(const e of w.exercises){const info=exInfo(e.name);
    if(info.t==="cardio"){if(e.warm)warm+=num(e.minutes);else minutes+=num(e.minutes);rows.push({name:e.name,cardio:true,min:num(e.minutes),int:intOf(e),km:num(e.km),warm:!!e.warm,note:e.note||""});continue}
    if(isCore(e.name)){const n=doneSets(e),tm=isTime(e.name),tot=exReps(e);coreSets+=n;sets.Addome=(sets.Addome||0)+n;
      const prev=prevEx(e.name,w.date,w.id);rows.push({name:e.name,sets:e.sets,uni:!!e.uni,time:tm,core:true,note:e.note||"",unit:tm?"s":"rip.",cur:tot,old:prev?exReps(prev.e):null});continue}
    const n=doneSets(e),v=exVol(e);nSets+=n;reps+=exReps(e);vol+=v;
    info.p.forEach(m=>sets[m]=(sets[m]||0)+n);info.s.forEach(m=>sets[m]=(sets[m]||0)+n*.5);
    const prev=prevEx(e.name,w.date,w.id),kgMode=v>0&&(!prev||exVol(prev.e)>0);
    rows.push({name:e.name,sets:e.sets,uni:!!e.uni,note:e.note||"",unit:kgMode?"kg":"rip.",cur:kgMode?v:exReps(e),old:prev?(kgMode?exVol(prev.e):exReps(prev.e)):null});
    const b=bestSet(e);
    if(b){let pb=0;for(const x of S.workouts){if(x.id===w.id||x.date>w.date)continue;const y=x.exercises.find(q=>q.name===e.name);const bb=y&&bestSet(y);if(bb&&bb.v>pb)pb=bb.v}
      if(pb&&b.v>pb+.01)prs.push({name:e.name,kg:b.kg,reps:b.reps,v:b.v,pb})}
  }
  return {sets,rows,prs,nSets,reps,vol,minutes,coreSets,warm};
}
function setsText(sets,uni,time){
  if(uni){const ss=sideSets({uni:true,sets});return `Dx ${setsText(ss.filter(x=>x.side==="dx"),false,time)}  |  Sx ${setsText(ss.filter(x=>x.side==="sx"),false,time)}`}
  if(time)return sets.filter(s=>num(s.reps)).map(s=>one(s.kg,s.reps,true)).join(", ");
  const groups=[];for(const s of sets){if(!num(s.reps))continue;const kg=r1(num(s.kg)),g=groups[groups.length-1];
    if(g&&g.kg===kg)g.reps.push(num(s.reps));else groups.push({kg,reps:[num(s.reps)]})}
  return groups.map(g=>`${g.kg?g.kg+" kg":"corpo libero"}: ${g.reps.join(", ")}`).join("  ·  ");
}
function summaryHTML(w){
  const s=workoutSummary(w);
  const ranked=Object.entries(s.sets).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const maxV=ranked.length?ranked[0][1]:1;
  const reg={push:0,pull:0,legs:0,core:0};ranked.forEach(([m,v])=>reg[MUSCLES[m]||"core"]+=v);
  const regTot=Object.values(reg).reduce((a,b)=>a+b,0)||1;
  const tiles=[[Math.round(s.vol).toLocaleString("it-IT")+" kg","Volume sollevato"],[s.nSets,"Serie con i pesi"]];
  if(s.coreSets)tiles.push([s.coreSets,"Serie di core"]);
  if(s.minutes)tiles.push([s.minutes+" min","Cardio"]);
  if(tiles.length<4)tiles.push([s.reps,"Ripetizioni"]);
  const bars=ranked.map(([m,v])=>`<div class="mbar"><span>${m==="Addome"?"Core":esc(m)}</span><div class="track"><div class="fill" style="width:${v/maxV*100}%;background:var(--${MUSCLES[m]||"core"})"></div></div><span class="v">${r1(v)}</span></div>`).join("");
  const regs=Object.entries(reg).filter(([,v])=>v>0);
  const cmp=s.rows.map(r=>{
    if(r.cardio)return `<tr><td>${esc(r.name)}<div class="small muted">${INT[r.int].l}${r.km?` · ${String(r.km).replace(".",",")} km`:""}${r.warm?" · riscaldamento":""}</div>${r.note?`<div class="small muted">${esc(r.note)}</div>`:""}</td><td>${r.min} min</td><td colspan="2" class="muted">${r.warm?"Non conta nel cardio":"Cardio"}</td></tr>`;
    let d=`<span class="muted">Prima volta</span>`;
    if(r.old!==null){const pct=r.old?Math.round((r.cur-r.old)/r.old*100):0;
      d=pct>0?`<span class="delta up">▲ ${pct}%</span>`:pct<0?`<span class="delta down">▼ ${Math.abs(pct)}%</span>`:`<span class="delta">uguale</span>`}
    return `<tr><td>${esc(r.name)}<div class="small muted">${r.core?"Core · ":""}${esc(setsText(r.sets,r.uni,r.time))}</div>${r.note?`<div class="small">${esc(r.note)}</div>`:""}</td><td>${Math.round(r.cur).toLocaleString("it-IT")} ${r.unit}</td><td>${r.old===null?"–":Math.round(r.old).toLocaleString("it-IT")+" "+r.unit}</td><td>${d}</td></tr>`}).join("");
  // recupero consigliato per i muscoli lavorati di più
  const rec={};ranked.forEach(([m,v])=>{if(m==="Cardio"||m==="Addome"||v<2)return;const until=addDays(w.date,BIG.has(m)?3:2);if(until<=today())return;(rec[until]??=[]).push(m)});
  const recTxt=Object.entries(rec).sort().map(([d,ms])=>`<b>${esc(ms.join(", "))}</b> fino a ${GIORNI[parse(d).getDay()]} ${nice(d)}`).join("; ");
  return `<h3 id="sumTitle">${esc(w.tpl||"Allenamento")}</h3><p class="small muted" style="margin:4px 0 0">${niceFull(w.date)}</p>
    <div class="stats">${tiles.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    ${s.prs.length?`<div class="sumsec"><h4>Nuovi record</h4><ul class="prs">${s.prs.map(p=>`<li><b>${esc(p.name)}</b>: ${r1(p.kg)} kg × ${p.reps}<div class="small muted">Massimale stimato ${r1(p.v)} kg, prima era ${r1(p.pb)} kg</div></li>`).join("")}</ul></div>`:""}
    ${ranked.length?`<div class="sumsec"><h4>Muscoli allenati</h4>
      <div class="regbar" aria-hidden="true">${regs.map(([k,v])=>`<span style="width:${v/regTot*100}%;background:var(--${k})"></span>`).join("")}</div>
      <div class="legend" style="margin:0 0 10px">${regs.map(([k,v])=>`<span><span class="dot" style="background:var(--${k})"></span>${REGION_NAME[k]} ${Math.round(v/regTot*100)}%</span>`).join("")}</div>
      ${bars}<p class="small muted" style="margin:6px 0 0">Serie per muscolo: 1 per i muscoli principali, 0,5 per quelli secondari.</p></div>`:""}
    <div class="sumsec"><h4>Rispetto all'ultima volta</h4><div class="chart"><table class="t" style="min-width:0"><thead><tr><th>Esercizio</th><th>Oggi</th><th>Ultima volta</th><th></th></tr></thead><tbody>${cmp}</tbody></table></div></div>
    ${recTxt||recoveryForWorkout(w)?`<div class="sumsec"><h4>Recupero consigliato</h4>${recTxt?`<p class="small" style="margin:0">Lascia riposare ${recTxt}.</p>`:""}${recoveryForWorkout(w)}</div>`:""}
    ${w.note?`<div class="sumsec"><h4>Note</h4><p class="small" style="margin:0;white-space:pre-wrap">${esc(w.note)}</p></div>`:""}`;
}

/* ---------- Condividi come immagine ---------- */
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
function fitText(g,t,max){if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+"…").width>max)t=t.slice(0,-1);return t.trimEnd()+"…"}
function rrect(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill()}
async function renderShareImage(w){
  const s=workoutSummary(w),W=1080,P=72;
  const muscles=Object.entries(s.sets).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const H=P+130+170+210+(muscles.length?90+muscles.length*60:0)+90+s.rows.length*100+(s.prs.length?90+s.prs.length*58:0)+110;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  try{await Promise.all(['700 64px "Barlow Condensed"','600 36px "Barlow Condensed"','400 28px "Barlow"','600 28px "Barlow"'].map(f=>document.fonts.load(f)))}catch(e){}
  const C={bg:"#14332A",card:"#0E261F",y:"#F5E04A",ink:"#F4F3EA",mut:"#AEBDB4",track:"#21473A"};
  const F=(wt,sz,cond)=>`${wt} ${sz}px ${cond?'"Barlow Condensed","Arial Narrow",sans-serif':'"Barlow",system-ui,sans-serif'}`;
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  g.strokeStyle=C.track;g.lineWidth=34;g.beginPath();g.arc(W-40,40,250,0,Math.PI*2);g.stroke();
  g.strokeStyle=C.y;g.lineCap="round";g.beginPath();g.arc(W-40,40,250,Math.PI*.55,Math.PI*1.05);g.stroke();
  let y=P;const logo=await loadImg("/logo.svg");
  if(logo)g.drawImage(logo,P,y,104,104);
  g.textBaseline="middle";g.fillStyle=C.y;g.font=F(700,60,1);g.fillText("LiftLog",P+(logo?128:0),y+54);
  y+=130;g.textBaseline="alphabetic";
  g.fillStyle=C.ink;g.font=F(700,92,1);g.fillText(fitText(g,w.tpl||"Allenamento",W-2*P),P,y+80);
  g.fillStyle=C.mut;g.font=F(400,32);g.fillText(niceFull(w.date),P,y+132);
  y+=170;
  const tiles=[[Math.round(s.vol).toLocaleString("it-IT"),"kg sollevati"],[String(s.nSets),"serie"],s.minutes?[String(s.minutes),"minuti di cardio"]:[String(s.reps),"ripetizioni"]];
  const tw=(W-2*P-2*20)/3;
  tiles.forEach(([v,l],i)=>{const x=P+i*(tw+20);g.fillStyle=C.card;rrect(g,x,y,tw,170,24);
    g.fillStyle=C.y;g.font=F(700,76,1);g.fillText(fitText(g,v,tw-48),x+28,y+92);g.fillStyle=C.mut;g.font=F(400,28);g.fillText(l,x+28,y+138)});
  y+=210;
  const head=(t,col)=>{g.fillStyle=col||C.ink;g.font=F(600,40,1);g.fillText(t,P,y+40);y+=80};
  if(muscles.length){head("Muscoli allenati");const max=muscles[0][1],bx=P+260,bw=W-P-bx-170;
    for(const [m,v] of muscles){g.fillStyle=C.ink;g.font=F(400,30);g.fillText(m,P,y+30);
      g.fillStyle=C.track;rrect(g,bx,y+8,bw,26,13);g.fillStyle=C.y;rrect(g,bx,y+8,Math.max(26,bw*v/max),26,13);
      g.fillStyle=C.mut;g.textAlign="right";g.fillText(`${String(r1(v)).replace(".",",")} serie`,W-P,y+30);g.textAlign="left";y+=60}
    y+=10}
  head("Esercizi");
  for(const r of s.rows){g.fillStyle=C.ink;g.font=F(600,36,1);g.fillText(fitText(g,r.name,W-2*P),P,y+34);
    g.fillStyle=C.mut;g.font=F(400,28);g.fillText(fitText(g,r.cardio?r.min+" minuti"+(r.warm?" di riscaldamento":""):setsText(r.sets,r.uni,r.time),W-2*P),P,y+74);y+=100}
  if(s.prs.length){y+=10;head("Nuovi record",C.y);
    for(const p of s.prs){g.fillStyle=C.ink;g.font=F(600,30);g.fillText(fitText(g,`${p.name}: ${String(r1(p.kg)).replace(".",",")} kg × ${p.reps}`,W-2*P),P,y+30);y+=58}}
  g.fillStyle=C.mut;g.font=F(400,26);g.fillText("Registrato con LiftLog",P,H-P+20);
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function shareWorkout(w){
  const blob=await renderShareImage(w);if(!blob)throw new Error("canvas");
  const file=new File([blob],`liftlog-${w.date}.png`,{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Il mio allenamento",text:`${w.tpl||"Allenamento"} del ${nice(w.date)}, registrato con LiftLog`});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  const url=URL.createObjectURL(blob),l=document.createElement("a");l.href=url;l.download=file.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Immagine scaricata");
}

/* ---------- Trascina per riordinare (allenamento e schede) ---------- */
const GRIP='<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg>';
app.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");if(!g||e.button>0)return;
  const list=g.dataset.list,sel=list==="draft"?".ex":".tplrow",item=g.closest(sel);if(!item)return;
  const items=[...item.parentElement.querySelectorAll(":scope > "+sel)],from=items.indexOf(item);if(from<0||items.length<2)return;
  e.preventDefault();
  const rects=items.map(x=>x.getBoundingClientRect()),h=rects[from].height,startY=e.clientY,startScroll=scrollY;
  let to=from,lastY=e.clientY,raf=0;
  item.classList.add("dragging");items.forEach(x=>{if(x!==item)x.classList.add("sliding")});
  try{g.setPointerCapture(e.pointerId)}catch(err){}
  const update=()=>{
    const dy=lastY-startY+(scrollY-startScroll);
    item.style.transform=`translateY(${dy}px)`;
    const mid=startY+dy;to=from; // posizione del dito, non il centro della card (le card sono alte)
    for(let k=0;k<from;k++)if(mid<rects[k].top+rects[k].height/2){to=k;break}
    if(to===from)for(let k=from+1;k<rects.length;k++)if(mid>rects[k].top+rects[k].height/2)to=k;
    items.forEach((x,k)=>{if(x===item)return;x.style.transform=(from<to&&k>from&&k<=to)?`translateY(${-h}px)`:(to<from&&k>=to&&k<from)?`translateY(${h}px)`:""});
  };
  // scorrimento automatico vicino ai bordi dello schermo
  const tick=()=>{const edge=70;if(lastY<edge)scrollBy(0,-Math.ceil((edge-lastY)/6));else if(lastY>innerHeight-edge)scrollBy(0,Math.ceil((lastY-innerHeight+edge)/6));update();raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
  const move=ev=>{lastY=ev.clientY};
  const up=()=>{cancelAnimationFrame(raf);g.removeEventListener("pointermove",move);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up);
    const arr=list==="draft"?draft.exercises:editTpl&&editTpl.items;
    if(arr&&to!==from){const [x]=arr.splice(from,1);arr.splice(to,0,x)}
    render();const ng=app.querySelector(`${sel}[data-i="${to}"] .grip`);if(ng)ng.focus({preventScroll:true})};
  g.addEventListener("pointermove",move);g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);
});

/* ---------- Esercizi personalizzati ---------- */
const dlg=document.getElementById("customDlg");
function openCustom(){
  document.getElementById("cName").value="";document.getElementById("cUni").checked=false;document.getElementById("cTime").checked=false;
  document.getElementById("cType").innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  const chips=n=>Object.keys(MUSCLES).map(m=>`<label><input type="checkbox" name="${n}" value="${esc(m)}">${esc(m)}</label>`).join("");
  document.getElementById("cPrim").innerHTML=chips("p");document.getElementById("cSec").innerHTML=chips("s");
  dlg.showModal();
}
document.getElementById("cCancel").onclick=()=>dlg.close();
document.getElementById("customForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("cName").value.trim().slice(0,60);
  const p=[...document.querySelectorAll('#cPrim input:checked')].map(i=>i.value);
  const s=[...document.querySelectorAll('#cSec input:checked')].map(i=>i.value).filter(m=>!p.includes(m));
  const t=document.getElementById("cType").value;
  if(!name){return}
  if(!p.length&&t!=="cardio"){alert("Scegli almeno un muscolo principale.");return}
  const u=t!=="cardio"&&document.getElementById("cUni").checked,tm=t!=="cardio"&&document.getElementById("cTime").checked;
  S.custom[name]={t,p:t==="cardio"&&!p.length?["Cardio"]:p,s,...(u?{u:true}:{}),...(tm?{time:true}:{})};
  dlg.close();
  try{await putCustom()}catch(err){toast("Esercizio non salvato")}
  draft.exercises.push(t==="cardio"?{name,minutes:"",sets:[],int:"moderata"}:{name,...(u?{uni:true}:{}),sets:[0,1,2].map(()=>copySet({},u))});
  render();
});
