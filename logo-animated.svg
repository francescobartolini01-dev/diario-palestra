<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="LiftLog" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .ring { stroke-dasharray: 352.9 490.1; animation: fill 1.6s cubic-bezier(.3,.8,.2,1) both; }
    .lifter { transform-box: fill-box; transform-origin: bottom; animation: lift 1s cubic-bezier(.2,1.4,.4,1) .3s both; }
    .bolt { animation: flash 4s ease-in-out 2s infinite; }
    @keyframes fill { from { stroke-dasharray: 0 490.1; } }
    @keyframes lift { from { transform: translateY(18px) scaleY(.5); opacity: 0; } }
    @keyframes flash { 0%, 88%, 100% { opacity: 1; } 90% { opacity: .35; } 92% { opacity: 1; } 94% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .ring, .lifter, .bolt { animation: none; } }
  </style>
  <circle cx="100" cy="100" r="92" fill="#14332A"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#F5E04A" stroke-opacity=".18" stroke-width="9"/>
  <circle class="ring" cx="100" cy="100" r="78" fill="none" stroke="#F5E04A" stroke-width="9" stroke-linecap="round" transform="rotate(-90 100 100)"/>
  <g transform="translate(0 14)">
    <g class="lifter" fill="#F5E04A">
      <path d="M66 52 H134" stroke="#F5E04A" stroke-width="5" stroke-linecap="round"/>
      <rect x="58" y="40" width="9" height="24" rx="2.5"/>
      <rect x="133" y="40" width="9" height="24" rx="2.5"/>
      <path d="M95 82 L84 53 M105 82 L116 53" stroke="#F5E04A" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="100" cy="72" r="7"/>
      <path class="bolt" d="M93 82 L111 82 L103 100 L116 100 L88 132 L96 108 L84 108 Z"/>
    </g>
  </g>
